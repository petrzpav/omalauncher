name: fork

# petrzpav's fork: every push to main builds dev.omalauncher.pavel, signed with the fork's own key, and puts the APK
# on a GitHub release (v<version>-pavel.<run>), where Obtainium on the phone picks it up. Upstream's release.yml
# (Simon's Play key) is disabled in the fork (gh workflow disable release). upstream.yml merges each upstream release
# once a day; by hand: git fetch upstream --tags && git merge <tag>
on:
  push:
    branches: [main]
    # A push that changes only the READMEs builds no new APK, which Obtainium would offer as an update. Other .md
    # files aren't skipped: the widget docs under app/src/main/assets ship inside the app.
    paths-ignore:
      - README.md
      - .github/README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      # libghostty-vt, omaterminal's engine (upstream 1.12.0): without it the APK builds without the built-in terminal and
      # its tests are skipped. Built fresh, as upstream's release.yml does.
      - name: Build libghostty-vt
        run: scripts/fetch-ghostty-vt.sh

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The FORK_KEYSTORE_* secrets aren't set; the APK would be debug-signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fork.p12"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/fork.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=pavel
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Test and build
        run: ./gradlew -PforkBuild=${{ github.run_number }} :owl:test :app:testFossDebugUnitTest :app:assembleFossRelease

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)-pavel.${{ github.run_number }}
          apk="omalauncher-$name.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          upstream=$(git log -1 --format='%h %s' --first-parent HEAD | cut -c1-200)
          # A re-run has the same run number: its release is there already, so the files are replaced.
          if gh release view "v$name" >/dev/null 2>&1; then
            gh release upload "v$name" "$apk" SHA256SUMS --clobber
          else
            gh release create "v$name" "$apk" SHA256SUMS --target "$GITHUB_SHA" --title "v$name" \
              --notes "dev.omalauncher.pavel, built from $GITHUB_SHA ($upstream)."
          fi
