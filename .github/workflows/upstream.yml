name: upstream

# petrzpav's fork: once a day, when Simon has released a version main doesn't have yet, merge that release into main
# and push it, which runs ci.yml and fork.yml: the tests, then a v<version>-pavel.<run> release for Obtainium. A merge
# that conflicts is never forced: main stays as it is, and the run fails with the files that conflict in its summary,
# which GitHub mails about; merge that release by hand (git fetch upstream --tags && git merge <tag>).
#
# The push needs FORK_SYNC_TOKEN, a fine-grained token for this repository with Contents and Workflows read and
# write: GITHUB_TOKEN's pushes don't start other workflows, and it can't push upstream's changes to .github/workflows.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "The FORK_SYNC_TOKEN secret isn't set; nothing can be merged" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge the latest upstream release
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git remote add upstream https://github.com/SimonSchubert/omalauncher.git
          git fetch --quiet --no-tags upstream
          tag=$(gh release view -R SimonSchubert/omalauncher --json tagName -q .tagName)
          git fetch --quiet --no-tags upstream "refs/tags/$tag:refs/tags/upstream-$tag"
          if git merge-base --is-ancestor "upstream-$tag" HEAD; then
            echo "main has $tag already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-ff --no-edit -m "Merge upstream release $tag" "upstream-$tag"; then
            git push origin HEAD:main
            echo "Merged $tag; ci and fork run on the push" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Upstream $tag doesn't merge cleanly; main is unchanged. Conflicts in:"
            echo
            git diff --name-only --diff-filter=U | sed 's/^/- /'
            echo
            echo "Merge it by hand: git fetch upstream --tags && git merge $tag, resolve, push."
          } | tee -a "$GITHUB_STEP_SUMMARY" >&2
          git merge --abort
          exit 1
